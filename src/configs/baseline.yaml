defaults:
  - model: amsdf_lav
  - writer: wandb
  - metrics: pages
  - datasets: fakeavcelebs
  - dataloader: dataloader
  - transforms: example
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-6
lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
loss_function:
  _target_: src.loss.WeightedCrossEntropyLoss
trainer:
  log_step: 500
  n_epochs: 100
  epoch_len: 5085
  device_tensors: ["av_audio", "av_video", "vivit_frames", "aasist_audio", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: "model_best.pth"  # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "max eval_Accuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 2 # checkpoint each save_period epochs in addition to the best epoch

  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1

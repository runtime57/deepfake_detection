defaults:
  - model: amsdf_wav_lav
  - writer: wandb_wav_1e-5
  - metrics: pages
  - datasets: fakeavcelebs
  - dataloader: dataloader
  - transforms: example
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 1e-4
lr_scheduler:
  _target_: torch.optim.LambdaLR
loss_function:
  _target_: src.loss.WeightedCrossEntropyLoss
trainer:
  log_step: 500
  n_epochs: 100
  epoch_len: 20400
  device_tensors: ["av_audio", "av_video", "aasist_audio", "vjepa_frames", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: null # "model_best.pth"  # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "max eval_Accuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 1 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
